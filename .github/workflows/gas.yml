name: GAS 後端部署

on:
  push:
    branches: [dev-001]
    paths:
      - 'codebase/gas/**'
      - '.github/workflows/gas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gas-deploy
  cancel-in-progress: false

jobs:
  # ── 推進 dev-001 → dev → main ──
  promote:
    name: 推進分支
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 推進 dev-001 → dev → main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # dev-001 → dev
          git push origin dev-001:dev
          # 拉取更新後的 dev 至本地參照
          git fetch origin dev:refs/heads/dev
          # dev → main
          git push origin dev:main

  # ── clasp push ──
  deploy:
    name: clasp 推送
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝 clasp
        run: npm install -g @google/clasp

      - name: 寫入 .clasp.json
        env:
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          cat > .clasp.json <<EOF
          {
            "scriptId": "${GAS_SCRIPT_ID}",
            "rootDir": "codebase/gas"
          }
          EOF

      - name: clasp 登入與推送
        env:
          CLASPRC_ACCESS_TOKEN: ${{ secrets.CLASPRC_ACCESS_TOKEN }}
          CLASPRC_ID_TOKEN: ${{ secrets.CLASPRC_ID_TOKEN }}
          CLASPRC_REFRESH_TOKEN: ${{ secrets.CLASPRC_REFRESH_TOKEN }}
          CLASPRC_CLIENT_ID: ${{ secrets.CLASPRC_CLIENT_ID }}
          CLASPRC_CLIENT_SECRET: ${{ secrets.CLASPRC_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.clasprc
          cat > ~/.clasprc.json <<EOF
          {
            "token": {
              "access_token": "${CLASPRC_ACCESS_TOKEN}",
              "id_token": "${CLASPRC_ID_TOKEN}",
              "refresh_token": "${CLASPRC_REFRESH_TOKEN}",
              "scope": "https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/script.deployments https://www.googleapis.com/auth/service.management https://www.googleapis.com/auth/logging.read https://www.googleapis.com/auth/cloud-platform",
              "expires_in": 3600,
              "expiry_date": 0
            },
            "oauth2ClientSettings": {
              "clientId": "${CLASPRC_CLIENT_ID}",
              "clientSecret": "${CLASPRC_CLIENT_SECRET}",
              "redirectUri": "http://localhost"
            },
            "isLocalCreds": false
          }
          EOF
          clasp push -f
