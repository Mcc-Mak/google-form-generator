name: GAS 後端部署

on:
  push:
    branches: [dev-001]
    paths:
      - 'codebase/gas/**'
      - '.github/workflows/gas.yml'
  workflow_dispatch:

concurrency:
  group: gas-deploy
  cancel-in-progress: false

jobs:
  # ── 推進 dev-001 → dev → main ──
  promote:
    name: 推進分支
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 推進 dev-001 → dev → main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # dev-001 → dev
          git push origin dev-001:dev
          # 拉取更新後的 dev 至本地參照
          git fetch origin dev:refs/heads/dev
          # dev → main
          git push origin dev:main

  # ── clasp push ──
  deploy:
    name: clasp 推送
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝 clasp
        run: npm install -g @google/clasp@3.4.1 --ignore-scripts

      - name: 寫入 .clasp.json
        env:
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          cat > .clasp.json <<EOF
          {
            "scriptId": "${GAS_SCRIPT_ID}",
            "rootDir": "codebase/gas"
          }
          EOF

      - name: clasp 登入、推送與部署
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_DEPLOYMENT_ID: AKfycbzN09AHK1xRtgOG7AywmiLHown1ltjCTwS-sHpTHTe82bmT3uIQ2O6xlcUrtNw8Pg6gCA
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          clasp push -f
          clasp deploy --deploymentId "$GAS_DEPLOYMENT_ID" --description "CI deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
