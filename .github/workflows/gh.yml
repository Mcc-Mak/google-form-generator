name: 前端建置與部署

on:
  push:
    branches: [dev-001]
    paths:
      - 'codebase/gh/**'
      - '.github/workflows/gh.yml'
  workflow_dispatch:

concurrency:
  group: gh-deploy
  cancel-in-progress: false

jobs:
  # ── 建置 ──
  build:
    name: 建置前端
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codebase/gh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codebase/gh/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: codebase/gh/dist

  # ── 推進 dev-001 → dev → main ──
  promote:
    name: 推進分支
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 推進 dev-001 → dev → main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # dev-001 → dev
          git push origin dev-001:dev
          # 拉取更新後的 dev 至本地參照
          git fetch origin dev:refs/heads/dev
          # dev → main
          git push origin dev:main

  # ── 部署 GitHub Pages ──
  deploy:
    name: 部署 GitHub Pages
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deploy
        uses: actions/deploy-pages@v4
